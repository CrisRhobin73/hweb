<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Rowspan</title>
    <style type="text/css">
        td, th { border: 1px solid #CCC;}
        table { border: 1px solid black;}
    </style>
</head>
<body>
    <table>
        <tr>
            <td rowspan="2">apples</td>
            <td>pears</td>
        </tr>
        <tr>
            <td>bananas</td>
        </tr>
        <tr>
            <td>oranges</td>
            <td rowspan="2">lychees</td>
        </tr>
        <tr>
            <td>pineapple</td>
        </tr>
    </table>
</body>
</html>
