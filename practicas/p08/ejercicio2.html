<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Colspan</title>
    <style type="text/css">
        td, th { border: 1px solid #CCC;}
        table { border: 1px solid black;}
    </style>
</head>
<body>
    <table>
        <tr>
            <td>7:00pm</td>
            <td>7:30pm</td>
            <td>8:00pm</td>
        </tr>
        <tr>
            <td colspan="2">The Sunday Night Movie</td>
            <td>Perry Mason</td>
        </tr>
        <tr>
            <td>Candid Camera</td>
            <td colspan="2">What's My Line</td>
        </tr>
        <tr>
            <td>Bonanza</td>
            <td colspan="2">The Wackiest Ship in the Army</td>
        </tr>
    </table>
</body>
</html>
